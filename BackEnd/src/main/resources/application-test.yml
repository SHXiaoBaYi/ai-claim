# 测试 profile：ECS 47.103.191.164 本机 MySQL（主机见 application.yml）
spring:
  datasource:
    url: jdbc:mysql://${xby.rds.internal-host}:${xby.rds.port}/${xby.rds.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${xby.rds.username}
    password: ${xby.rds.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

xby:
  upload-public-base: ${UPLOAD_PUBLIC_BASE:http://47.103.191.164/shxby/api}
  # 只允许钉钉扫码登录
  auth:
    password-login-enabled: false

# 测试环境保留 Swagger，便于联调
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
